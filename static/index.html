        Read the pasted line before you press Enter, then read dlg's echo before you type y.</p>
      <ul class="meta">
        <li>The primary investigates read-only, but what it reads is sent to its vendor.</li>
        <li>The implement command can write files in the working directory.</li>
        <li>A reviewer runner gets the handoff on stdin; what it reads is sent to its vendor. A y at the prompt approves it, so the Run buttons and auto rounds can start it.</li>
      </ul>
      ${agents.map(a => `<h3>${esc(a.name)}</h3>
        <p class="meta">Primary: <code>${esc(a.primary)}</code> · implement: <code>${esc(a.implement)}</code></p>
        ${paste(`dlg config use ${a.name}`)}
        <p class="meta">As a reviewer (runs <code>${esc(a.primary)}</code>):</p>
        ${paste(`dlg config set-runner ${a.name}`)}`).join("")}
      <h3>Using different models</h3>
      <p class="meta"><b>Primary (claude).</b> Add model presets once; then pick model, context and reasoning per run beside
        "Model for ${esc(s.primary_name)}'s analysis" (Overview) and "Model for implementation" (Decision), and "make default" to keep a choice.</p>
      ${paste("dlg config init-models claude")}
      <p class="meta">Or one preset of your own (key, label, context label, then the choices):</p>
      <pre>dlg config add-model opus-1m "Opus 1M" "1M" --model opus --context 1m --effort high</pre>
      <p class="meta"><b>Reviewer (cursor).</b> No setup: its card in the Reviewers tab lists <code>cursor-agent --list-models</code> as model,
        context and reasoning; "make default" is what auto rounds use. In a terminal: <code>dlg run &lt;id&gt; cursor --model &lt;id&gt;</code>.
        If the runner command already has <code>--model</code>, that model is used and the picker is off.</p>
      <p class="meta"><b>A second Claude model as a reviewer.</b> Give it its own name (not ${esc(s.primary_name)}), add that name under
        "Secondary models" above, then set and approve its runner:</p>
      <pre>dlg config set-runner sonnet 'claude -p --model sonnet'</pre>
      <p class="meta">A model from another vendor (through cursor) is a more independent check than a second Claude model.
        The Cost tab shows each run's selected model next to the one the agent reports it used.</p>
      <h3>Other agents (type these yourself)</h3>
      <pre>dlg config set-primary &lt;name&gt; '&lt;command&gt;' ['&lt;implement-command&gt;']
dlg config set-runner &lt;agent&gt; '&lt;command&gt;'
dlg config set-workdir &lt;dir&gt;</pre>
      <p class="meta">Quote each command so it is one word. In a script (no terminal), use, set-primary and set-workdir need --yes right after the subcommand; set-runner stores the command unapproved. A --yes anywhere else becomes part of the command, and the echo shows it.</p>
    </details>`;
}

// Commands change in the terminal, so re-read them when the user comes back to this tab.
const refreshSettings = () => { if ($("settings").open) refresh().then(renderCommands, e => showError(e.message)); };
window.addEventListener("focus", refreshSettings);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshSettings(); });

function saveSettings() {
  const body = { primary_name: val("s_primary_name") };   // commands and workdir are CLI-only; the server refuses them
  const names = id => [...new Set(val(id).split(",").map(s => s.trim()).filter(Boolean))];
  body.secondary_names = names("s_secondary_names");
  body.secondary_with_code = names("s_secondary_with_code");
  act(null, async () => { await api("PUT", "/api/settings", body); $("settings").close(); });
}

async function importFile(input) {
  const file = input.files[0];
  if (!file) return;
  act(null, async () => { await api("POST", "/api/import", JSON.parse(await file.text())); input.value = ""; });
}

(async () => {
  applyLayout();
  loadModels(false).then(() => current && renderMain());   // a slow list command must not delay the page
  await refresh();
  loadReviewerModels(false).then(() => current && renderMain());
  const r = hashRoute(), exists = id => id && state.problems.some(p => p.id === id);
  tab = r.tab;
  const id = exists(r.id) ? r.id : state.settings.last_problem_id;
  if (exists(id)) await openProblem(id);
})();
</script>
</body>
</html>
